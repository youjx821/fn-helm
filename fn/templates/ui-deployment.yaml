{{- if .Values.ui.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "fullname" . }}-ui
  labels:
    app: {{ template "fullname" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "fullname" . }}
      release: {{ .Release.Name }}
      role: ui
  template:
    metadata:
       labels:
         app: {{ template "fullname" . }}
         chart: {{ .Chart.Name }}-{{ .Chart.Version }}
         heritage: {{ .Release.Service }}
         release: {{ .Release.Name }}
         role: ui
    spec:
      containers:
        - name: flow-ui
          image: {{ .Values.ui.flowui.image }}:{{ .Values.ui.flowui.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
{{ toYaml .Values.ui.flowui.resources | indent 12 }}
          ports:
            - containerPort: {{ .Values.ui.service.port }}
          env:
            - name: API_URL
              value: http://{{ template "fullname" . }}:{{ .Values.fn_api.service.port }}
            - name: COMPLETER_BASE_URL
              value: http://{{ template "fullname" . }}-flow:{{ .Values.flow.service.port }}

{{- end}}
