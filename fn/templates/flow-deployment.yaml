apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "fullname" . }}-flow-depl
  labels:
    app: {{ template "fullname" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "fullname" . }}
      release: {{ .Release.Name }}
      role: flow
  template:
    metadata:
       labels:
         app: {{ template "fullname" . }}
         chart: {{ .Chart.Name }}-{{ .Chart.Version }}
         heritage: {{ .Release.Service }}
         release: {{ .Release.Name }}
         role: flow
    spec:
      containers:
        - name: flow
          image: {{ .Values.flow.image }}:{{ .Values.flow.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
{{ toYaml .Values.flow.resources | indent 12 }}
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /ping
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 3
          env:
          - name: LOG_LEVEL
            value: {{ .Values.flow.logLevel }}
          - name: LISTEN
            value: :8081
          {{- if .Values.flow.usePostgresql }}
          - name: DB_PASSWD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-postgresql
                key: password
          - name: DB_HOST
            value: {{ .Release.Name }}-postgresql
          - name: DB_URL
            value: postgres://fnapp:$(DB_PASSWD)@$(DB_HOST):5432/fndb?sslmode=disable
          {{- else }}
          # NOTE: Fn Flow (<= 0.1.85) only supports mysql/sqlite3 drivers and
          # cannot use PostgreSQL, so it defaults to embedded sqlite storage.
          - name: DB_URL
            value: {{ .Values.flow.dbUrl | quote }}
          {{- end }}
          - name: API_URL
            value: http://{{ template "fullname" . }}:{{ .Values.fn_api.service.port }}
