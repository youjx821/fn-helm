apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "fullname" . }}-runner
  labels:
    app: {{ template "fullname" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.fn_runner.replicas }}
  selector:
    matchLabels:
      app: {{ template "fullname" . }}
      release: {{ .Release.Name }}
      role: runner
  template:
    metadata:
       labels:
         app: {{ template "fullname" . }}
         chart: {{ .Chart.Name }}-{{ .Chart.Version }}
         heritage: {{ .Release.Service }}
         release: {{ .Release.Name }}
         role: runner
    spec:
      {{- if .Values.fn_runner.hostNetwork }}
      # The runner must reach the function containers spawned by the host
      # docker daemon (docker bridge network), which requires host networking.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.fn_runner.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.fn_runner.nodeSelector | indent 8 }}
{{- end }}
      {{- if .Values.fn_runner.tolerations }}
      tolerations:
{{ toYaml .Values.fn_runner.tolerations | indent 8 }}
{{- end }}
      {{- if .Values.fn_runner.docker.enabled }}
      volumes:
        - name: docker-socket
          hostPath:
            path: {{ .Values.fn_runner.docker.hostPath | default "/var/run/docker.sock" }}
            type: Socket
        # fn's hot protocol passes the listener unix socket to function
        # containers through /tmp/iofs; the host docker daemon bind-mounts
        # that path from the HOST, so it must be shared with the runner.
        - name: iofs-dir
          hostPath:
            path: /tmp/iofs
            type: DirectoryOrCreate
      {{- end }}
      containers:
        - name: runner
          image: {{ .Values.fn_runner.image }}:{{ .Values.fn_runner.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- if .Values.dockerExternal }}
          # skip the image's dind entrypoint; exec fnserver directly
          command: ["./fnserver"]
          workingDir: /app
          {{- end }}
          resources:
{{ toYaml .Values.fn_runner.resources | indent 12 }}
          securityContext:
            privileged: true
          ports:
          - containerPort: {{ .Values.fn_runner.grpc_port }}
          {{- if .Values.fn_runner.docker.enabled }}
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
            - name: iofs-dir
              mountPath: /tmp/iofs
          {{- end }}
          env:
          - name: FN_NODE_TYPE
            value: "pure-runner"
          - name: FN_GRPC_PORT
            value: {{ .Values.fn_runner.grpc_port | quote }}
          {{- if .Values.dockerExternal }}
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          {{- end }}
          {{- range $key, $value := .Values.fn_runner.env }}
            {{- if $value }}
          - name: {{ $key }}
            value: {{ $value | quote }}
            {{- end }}
          {{- end }}
