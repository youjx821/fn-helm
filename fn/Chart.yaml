apiVersion: v2
name: fn
description: Open source container native Functions as a Service (FaaS) platform
type: application
version: 0.2.0
appVersion: "0.0.161"
keywords:
- faas
- fn
- containers
- functions
- serverless
home: http://fnproject.io/
icon: http://fnproject.io/images/fn-300x125.png
sources:
- https://github.com/fnproject/fn
- https://github.com/fnproject/flow
- https://github.com/fnproject/flowui
maintainers:
- name: Derek Schultz
  email: derek.schultz@oracle.com
- name: Owen Cliffe
  email: owen.cliffe@oracle.com

# Sub-chart dependencies (Helm 3.8+, pulled from the Bitnami OCI registry).
# The legacy https://kubernetes-charts.storage.googleapis.com/ stable repo is
# long dead, so PostgreSQL and Redis now come from Bitnami.
dependencies:
- name: postgresql
  version: 16.7.27
  repository: oci://registry-1.docker.io/bitnamicharts
  condition: postgresql.enabled
- name: redis
  version: 23.1.3
  repository: oci://registry-1.docker.io/bitnamicharts
  condition: redis.enabled
